[env:timebuddy]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.partitions = no_fs.csv
extra_scripts = pre:make_web.py
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    moononournation/GFX Library for Arduino@1.6.9
    bblanchon/ArduinoJson@7.4.3

; Upload over Wi-Fi to a running TimeBuddy: pio run -e ota -t upload
; Set upload_port to its address if timebuddy.local doesn't resolve.
[env:ota]
extends = env:timebuddy
upload_protocol = custom
upload_port = timebuddy.local
upload_command = curl --fail --show-error -F "firmware=@$SOURCE" http://$UPLOAD_PORT/update
